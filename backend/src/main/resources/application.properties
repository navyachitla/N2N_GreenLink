# Server Configuration
server.port=8080
server.servlet.context-path=/

# Database Configuration (Supports PostgreSQL Cloud DB via Environment Variables, defaults to In-Memory for instant Render boot)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:greenlink_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Application Custom Properties
app.jwt.secret=${JWT_SECRET:GreenLinkSuperSecretKeyForJWTSigningAndAuthenticationTokenValidation20261234567890}
app.jwt.expiration-ms=86400000
app.upload.dir=uploads
